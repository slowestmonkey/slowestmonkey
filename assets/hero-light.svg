<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t d">
  <title id="t">Mark Tsiareshka: payments by day, experiments by night</title>
  <desc id="d">A terminal listing an experiments folder: gwt, opendiff, fractal, sauntrakai, spacer, podcut.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .title { font-size: 12px; fill: #656d76; }
    .p { fill: #1a7f37; }
    .c { fill: #1f2328; }
    .t { fill: #0969da; font-weight: 600; }
    .o { fill: #1f2328; font-weight: 600; }
    .m { fill: #656d76; }
    .cur { fill: #1f2328; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="719" height="251" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
